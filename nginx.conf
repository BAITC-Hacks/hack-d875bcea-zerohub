server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Configure a production reverse proxy here if using a relative /api URL.
    # The default demo image deliberately does not connect to a backend.
    location /api/ {
        default_type application/json;
        return 503 '{"detail":"Configure the production API URL or reverse proxy."}';
    }
}
