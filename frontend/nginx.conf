# Loaded in Nginx's http context by its standard Docker image.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Docker's embedded resolver refreshes the backend address after recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend backend:8000;
    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api { return 308 /api/; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
